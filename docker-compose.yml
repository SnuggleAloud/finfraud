version: "3.8"

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finfraud-api
    ports:
      - "8000:8000"
    command: ["uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8000"]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  dashboard:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: finfraud-dashboard
    ports:
      - "8501:8501"
    command: ["streamlit", "run", "app/streamlit_app.py", "--server.port", "8501", "--server.headless", "true"]
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
